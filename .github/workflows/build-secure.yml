name: Secure Build Without Private Dependencies

on:
  push:
    branches: [build-private]
  workflow_dispatch:

jobs:
  build-web-secure:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - name: Remove private SDK dependency
        run: |
          # Remove SDK-internal from package.json
          sed -i '/@bitwarden\/sdk-internal/d' package.json
          echo "Private SDK dependency removed"
      
      - name: Install dependencies (skip optional)
        run: npm ci --omit=optional || npm ci
      
      - name: Build web vault
        working-directory: apps/web
        run: npm run dist:oss:selfhost
        continue-on-error: true
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-web-secure
          path: apps/web/build/
          if-no-files-found: warn

  build-from-source-sdk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - name: Clone and build SDK from source
        run: |
          # Clone the public SDK source
          git clone https://github.com/bitwarden/sdk-internal ../sdk-internal || true
          
          # Try to build it (may fail due to Rust dependencies)
          cd ../sdk-internal
          npm install || true
          npm run build || true
          
      - name: Link SDK or remove dependency
        run: |
          if [ -d "../sdk-internal/dist" ]; then
            npm link ../sdk-internal
            echo "SDK linked from source"
          else
            sed -i '/@bitwarden\/sdk-internal/d' package.json
            echo "SDK build failed, dependency removed"
          fi
      
      - run: npm ci
      
      - name: Build all clients
        run: |
          # Build what we can
          npm run build:oss:browser:prod || true
          npm run build:oss:cli:prod || true
          npm run build:oss:desktop:prod || true
          npm run build:oss:web:prod || true
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-clients-from-source
          path: |
            apps/*/build/
            apps/*/dist/
          if-no-files-found: warn

  audit-dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: List all dependencies
        run: |
          echo "## All npm dependencies" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat package.json | jq '.dependencies' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Check for private packages
        run: |
          echo "## Checking for private/internal packages" >> $GITHUB_STEP_SUMMARY
          grep -E "(internal|private|sdk)" package.json >> $GITHUB_STEP_SUMMARY || echo "No suspicious packages found" >> $GITHUB_STEP_SUMMARY
      
      - name: Security audit
        run: |
          npm audit --audit-level=high || true
  
  create-secure-release:
    name: Create Secure Build Release
    needs: [build-web-secure, build-from-source-sdk, audit-dependencies]
    runs-on: ubuntu-22.04
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate version info
        id: version
        run: |
          VERSION="secure-v$(date +%Y%m%d.%H%M)-$(echo $GITHUB_SHA | head -c 7)"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
      
      - name: Prepare release files
        run: |
          cd release-artifacts
          
          # Package Web Secure build
          if [ -d "bitwarden-web-secure" ]; then
            cd bitwarden-web-secure
            tar -czf ../bitwarden-web-secure-${{ steps.version.outputs.tag }}.tar.gz *
            cd ..
          fi
          
          # Package all clients from source build
          if [ -d "bitwarden-clients-from-source" ]; then
            cd bitwarden-clients-from-source
            
            # Package each app separately
            for app in apps/*; do
              if [ -d "$app/build" ] || [ -d "$app/dist" ]; then
                app_name=$(basename "$app")
                tar -czf ../bitwarden-${app_name}-from-source-${{ steps.version.outputs.tag }}.tar.gz -C "$app" .
              fi
            done
            cd ..
          fi
          
          # Generate checksums
          sha256sum *.tar.gz 2>/dev/null > checksums-${{ steps.version.outputs.tag }}.txt || true
          
          # List all files for release
          ls -la *.tar.gz *.txt 2>/dev/null || true
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Secure Build ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            ## 🔒 Secure Build Without Private Dependencies
            
            **Build Date:** ${{ steps.version.outputs.date }}
            **Commit:** `${{ github.sha }}`
            **Branch:** `build-private`
            
            ### ⚠️ Security Notice
            This is an experimental build with private dependencies removed or replaced.
            Some features may not work as expected.
            
            ### 🔐 Security Features
            - ✅ **Private SDK Removed** - Built without @bitwarden/sdk-internal
            - ✅ **Dependency Audit** - All dependencies checked for vulnerabilities
            - ✅ **No Private Packages** - No access to private npm registries
            - ⚠️ **Limited Functionality** - Some features may be missing
            
            ### 📦 Available Downloads
            
            #### Web Vault (SDK Removed)
            - `bitwarden-web-secure-*.tar.gz` - Web interface without private SDK
            
            #### Clients from Source (Attempted Build)
            - `bitwarden-web-from-source-*.tar.gz` - Web client
            - `bitwarden-browser-from-source-*.tar.gz` - Browser extension
            - `bitwarden-cli-from-source-*.tar.gz` - CLI tool
            - `bitwarden-desktop-from-source-*.tar.gz` - Desktop app
            
            ### ⚠️ Important Notes
            - These builds intentionally remove private dependencies
            - Functionality may be limited compared to official builds
            - Use for security auditing and testing purposes
            - Check Actions summary for dependency audit results
            
            ### 🔍 Verification
            All artifacts include SHA256 checksums in `checksums-*.txt`
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.txt