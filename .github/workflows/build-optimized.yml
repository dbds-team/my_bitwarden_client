name: Build Bitwarden Clients (Optimized)

on:
  push:
    branches: [build-private]
  workflow_dispatch:

jobs:
  build-sdk:
    name: Build SDK from Source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dbds-team/my_sdk-internal
          path: sdk-internal
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk-internal -> target
      
      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      
      - name: Build WASM SDK
        working-directory: sdk-internal/crates/bitwarden-wasm-internal
        run: |
          wasm-pack build --target nodejs --out-dir pkg
          echo "SDK WASM build completed"
      
      - name: Package SDK for npm
        working-directory: sdk-internal
        run: |
          if [ ! -f "crates/bitwarden-wasm-internal/pkg/package.json" ]; then
            echo '{
              "name": "@bitwarden/sdk-internal",
              "version": "0.2.0-local",
              "main": "bitwarden_wasm_internal.js",
              "types": "bitwarden_wasm_internal.d.ts"
            }' > crates/bitwarden-wasm-internal/pkg/package.json
          fi
          
          cd crates/bitwarden-wasm-internal/pkg
          npm pack
          mv *.tgz ../../../sdk-internal.tgz
      
      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-internal-wasm
          path: sdk-internal/sdk-internal.tgz

  build-web:
    needs: build-sdk
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-internal-wasm
          path: sdk-internal
      
      - name: Link SDK to project
        run: |
          npm install ./sdk-internal/sdk-internal.tgz --no-save
          echo "Local SDK linked successfully"
      
      - run: npm ci
      
      - name: Build web
        working-directory: apps/web
        run: npm run dist:oss:selfhost
        continue-on-error: true
      
      - name: Package web vault
        working-directory: apps/web
        run: |
          if [ -d build ]; then
            cd build
            tar -czf ../../bitwarden-web.tar.gz *
            echo "Web vault packaged"
          fi
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-web
          path: apps/bitwarden-web.tar.gz
          if-no-files-found: warn
  
  build-desktop:
    needs: build-sdk
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            dist-cmd: dist:lin
            artifact-name: bitwarden-desktop-linux
            file-pattern: "*.AppImage *.deb *.rpm *.snap"
          - os: windows-2022
            dist-cmd: dist:win:ci
            artifact-name: bitwarden-desktop-windows  
            file-pattern: "*.exe *.msi"
          - os: macos-latest
            dist-cmd: dist:mac
            artifact-name: bitwarden-desktop-macos
            file-pattern: "*.dmg *.pkg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/desktop_native -> target
      
      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-internal-wasm
          path: sdk-internal
      
      - name: Link SDK to project
        run: |
          npm install ./sdk-internal/sdk-internal.tgz --no-save
      
      - run: npm ci
      
      - name: Build desktop native
        working-directory: apps/desktop/desktop_native
        run: npm run build
        continue-on-error: true
      
      - name: Build desktop
        working-directory: apps/desktop
        run: |
          npm run ${{ matrix.dist-cmd }}
        shell: bash
        continue-on-error: true
      
      - name: List build artifacts
        working-directory: apps/desktop/dist
        run: |
          echo "Build artifacts:"
          ls -lah
        shell: bash
      
      - name: Upload only installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/*.snap
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.msi
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.pkg
            apps/desktop/dist/*.zip
            !apps/desktop/dist/*-blockmap.zip
            !apps/desktop/dist/*.blockmap
            !apps/desktop/dist/*-unpacked
          if-no-files-found: warn
  
  build-cli:
    needs: build-sdk
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-internal-wasm
          path: sdk-internal
      
      - name: Link SDK to project
        run: |
          npm install ./sdk-internal/sdk-internal.tgz --no-save
      
      - run: npm ci
      
      - name: Build CLI
        working-directory: apps/cli
        run: npm run dist:oss:lin
        continue-on-error: true
      
      - name: Package CLI binary only
        working-directory: apps/cli
        run: |
          if [ -f dist/linux/bw ]; then
            tar -czf ../bitwarden-cli-linux.tar.gz -C dist/linux bw
          fi
          if [ -f dist/windows/bw.exe ]; then
            zip -j ../bitwarden-cli-windows.zip dist/windows/bw.exe
          fi
          if [ -f dist/macos/bw ]; then
            tar -czf ../bitwarden-cli-macos.tar.gz -C dist/macos bw
          fi
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-cli
          path: |
            apps/bitwarden-cli-*.tar.gz
            apps/bitwarden-cli-*.zip
          if-no-files-found: warn
  
  build-browser:
    needs: build-sdk
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        browser: [chrome, firefox]  # Removed edge to save space
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-internal-wasm
          path: sdk-internal
      
      - name: Link SDK to project
        run: |
          npm install ./sdk-internal/sdk-internal.tgz --no-save
      
      - run: npm ci
      
      - name: Build browser extension
        working-directory: apps/browser
        run: npm run dist:${{ matrix.browser }}
        continue-on-error: true
      
      - name: Package extension
        working-directory: apps/browser
        run: |
          cd build
          zip -r ../../bitwarden-browser-${{ matrix.browser }}.zip *
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-browser-${{ matrix.browser }}
          path: apps/bitwarden-browser-${{ matrix.browser }}.zip
          if-no-files-found: warn
  
  create-release:
    name: Create Optimized Release
    needs: [build-web, build-desktop, build-cli, build-browser]
    runs-on: ubuntu-22.04
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate version info
        id: version
        run: |
          VERSION="v$(date +%Y%m%d.%H%M)-$(echo $GITHUB_SHA | head -c 7)"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
      
      - name: Organize release files
        run: |
          cd release-artifacts
          
          # Move all installers to root
          find . -name "*.AppImage" -exec mv {} . \; 2>/dev/null || true
          find . -name "*.deb" -exec mv {} . \; 2>/dev/null || true
          find . -name "*.rpm" -exec mv {} . \; 2>/dev/null || true
          find . -name "*.snap" -exec mv {} . \; 2>/dev/null || true
          find . -name "*.exe" -exec mv {} . \; 2>/dev/null || true
          find . -name "*.msi" -exec mv {} . \; 2>/dev/null || true
          find . -name "*.dmg" -exec mv {} . \; 2>/dev/null || true
          find . -name "*.pkg" -exec mv {} . \; 2>/dev/null || true
          find . -name "*.tar.gz" -exec mv {} . \; 2>/dev/null || true
          find . -name "*.zip" -exec mv {} . \; 2>/dev/null || true
          
          # Rename files with version
          for file in *; do
            if [ -f "$file" ]; then
              extension="${file##*.}"
              filename="${file%.*}"
              # Skip if already has version
              if [[ ! "$filename" =~ v[0-9]{8} ]]; then
                mv "$file" "${filename}-${{ steps.version.outputs.tag }}.${extension}" 2>/dev/null || true
              fi
            fi
          done
          
          # Generate checksums
          sha256sum * > checksums-${{ steps.version.outputs.tag }}.txt 2>/dev/null || true
          
          # List final files with sizes
          echo "=== Release Files ==="
          ls -lah *.* | grep -v "^d" || true
          
          # Calculate total size
          total_size=$(du -sh . | cut -f1)
          echo "Total size: $total_size"
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Bitwarden Clients (Optimized) ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ## 🚀 Bitwarden Clients Release ${{ steps.version.outputs.tag }}
            
            **Build Date:** ${{ steps.version.outputs.date }}
            **Commit:** `${{ github.sha }}`
            **Branch:** `build-private`
            
            ### ✨ Optimized Build
            - ✅ **Reduced Size** - Only essential files included
            - ✅ **Single Architecture** - Windows x64 only (for smaller size)
            - ✅ **100% Open Source** - SDK built from source
            - ✅ **No Telemetry** - Privacy-focused build
            
            ### 📦 Downloads
            
            #### 🌐 Web Vault
            - `bitwarden-web-*.tar.gz` - Self-hosted web interface (~10MB)
            
            #### 💻 Desktop Applications
            **Windows:**
            - `Bitwarden-*-x64.exe` - Installer (Recommended)
            - `Bitwarden-Portable-*.exe` - Portable version
            
            **Linux:**
            - `Bitwarden-*.AppImage` - Universal package (Recommended)
            - `bitwarden_*.deb` - Debian/Ubuntu
            - `bitwarden-*.rpm` - Fedora/RHEL
            - `bitwarden_*.snap` - Snap package
            
            **macOS:**
            - `Bitwarden-*.dmg` - Disk image (Recommended)
            - `Bitwarden-*.pkg` - Installer package
            
            #### 🖥️ CLI Tool
            - `bitwarden-cli-linux-*.tar.gz` - Linux binary
            - `bitwarden-cli-windows-*.zip` - Windows binary
            - `bitwarden-cli-macos-*.tar.gz` - macOS binary
            
            #### 🌍 Browser Extensions
            - `bitwarden-browser-chrome-*.zip` - Chrome/Edge/Brave
            - `bitwarden-browser-firefox-*.zip` - Firefox
            
            ### 📝 Installation
            
            **Web Vault:**
            ```bash
            tar -xzf bitwarden-web-*.tar.gz
            # Serve with nginx/apache
            ```
            
            **CLI:**
            ```bash
            tar -xzf bitwarden-cli-linux-*.tar.gz
            chmod +x bw
            ./bw --help
            ```
            
            **Browser Extension:**
            1. Extract zip file
            2. Open browser extension management
            3. Enable developer mode
            4. Load unpacked extension
            
            ### 🔒 Verify Checksums
            ```bash
            sha256sum -c checksums-*.txt
            ```
          files: |
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.rpm
            release-artifacts/*.snap
            release-artifacts/*.dmg
            release-artifacts/*.pkg
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/*.txt