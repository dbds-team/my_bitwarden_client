name: Build Bitwarden Clients

on:
  push:
    branches: [build-private]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - run: npm ci
      
      - name: Build web
        working-directory: apps/web
        run: npm run dist:oss:selfhost
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-web
          path: apps/web/build/
  
  build-desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
        with:
          workdir: apps/desktop/desktop_native
      
      - run: npm ci
      
      - name: Build desktop native
        working-directory: apps/desktop/desktop_native
        run: npm run build
      
      - name: Build desktop
        working-directory: apps/desktop
        run: npm run dist:lin
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-desktop
          path: apps/desktop/dist/*
  
  build-cli:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - run: npm ci
      
      - name: Build CLI
        working-directory: apps/cli
        run: npm run dist:oss:lin
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-cli
          path: apps/cli/dist/**/*
  
  build-browser:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - run: npm ci
      
      - name: Build browser extension
        working-directory: apps/browser
        run: npm run dist:${{ matrix.browser }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-browser-${{ matrix.browser }}
          path: apps/browser/build/