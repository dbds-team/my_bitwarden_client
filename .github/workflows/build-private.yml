name: Build Bitwarden Clients with Open Source SDK

on:
  push:
    branches: [build-private]
  workflow_dispatch:

jobs:
  build-sdk:
    name: Build SDK from Source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dbds-team/my_sdk-internal
          path: sdk-internal
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk-internal -> target
      
      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      
      - name: Build WASM SDK
        working-directory: sdk-internal/crates/bitwarden-wasm-internal
        run: |
          wasm-pack build --target nodejs --out-dir pkg
          echo "SDK WASM build completed"
      
      - name: Package SDK for npm
        working-directory: sdk-internal
        run: |
          # Create a minimal package.json if needed
          if [ ! -f "crates/bitwarden-wasm-internal/pkg/package.json" ]; then
            echo '{
              "name": "@bitwarden/sdk-internal",
              "version": "0.2.0-local",
              "main": "bitwarden_wasm_internal.js",
              "types": "bitwarden_wasm_internal.d.ts"
            }' > crates/bitwarden-wasm-internal/pkg/package.json
          fi
          
          # Create tarball for later use
          cd crates/bitwarden-wasm-internal/pkg
          npm pack
          mv *.tgz ../../../sdk-internal.tgz
      
      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-internal-wasm
          path: |
            sdk-internal/crates/bitwarden-wasm-internal/pkg/
            sdk-internal/sdk-internal.tgz

  build-web:
    needs: build-sdk
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-internal-wasm
          path: sdk-internal
      
      - name: Link SDK to project
        run: |
          # Install the locally built SDK
          npm install ./sdk-internal/sdk-internal.tgz --no-save
          echo "Local SDK linked successfully"
      
      - run: npm ci
      
      - name: Build web
        working-directory: apps/web
        run: npm run dist:oss:selfhost
        continue-on-error: true
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-web
          path: apps/web/build/
  
  build-desktop:
    needs: build-sdk
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-12]
        include:
          - os: ubuntu-22.04
            dist-cmd: dist:lin
            artifact-name: bitwarden-desktop-linux
          - os: windows-2022
            dist-cmd: dist:win
            artifact-name: bitwarden-desktop-windows
          - os: macos-12
            dist-cmd: dist:mac
            artifact-name: bitwarden-desktop-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os != 'macos-12'
      
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os == 'macos-12'
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/desktop_native -> target
      
      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-internal-wasm
          path: sdk-internal
      
      - name: Link SDK to project
        run: |
          npm install ./sdk-internal/sdk-internal.tgz --no-save
      
      - run: npm ci
      
      - name: Build desktop native
        working-directory: apps/desktop/desktop_native
        run: npm run build
        continue-on-error: true
      
      - name: Build desktop
        working-directory: apps/desktop
        run: npm run ${{ matrix.dist-cmd }}
        continue-on-error: true
      
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: apps/desktop/dist/*
          if-no-files-found: warn
  
  build-cli:
    needs: build-sdk
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-internal-wasm
          path: sdk-internal
      
      - name: Link SDK to project
        run: |
          npm install ./sdk-internal/sdk-internal.tgz --no-save
      
      - run: npm ci
      
      - name: Build CLI
        working-directory: apps/cli
        run: npm run dist:oss:lin
        continue-on-error: true
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-cli
          path: apps/cli/dist/**/*
          if-no-files-found: warn
  
  build-browser:
    needs: build-sdk
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-internal-wasm
          path: sdk-internal
      
      - name: Link SDK to project
        run: |
          npm install ./sdk-internal/sdk-internal.tgz --no-save
      
      - run: npm ci
      
      - name: Build browser extension
        working-directory: apps/browser
        run: npm run dist:${{ matrix.browser }}
        continue-on-error: true
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-browser-${{ matrix.browser }}
          path: apps/browser/build/
          if-no-files-found: warn
  
  create-release:
    name: Create Release with All Artifacts
    needs: [build-sdk, build-web, build-desktop, build-cli, build-browser]
    runs-on: ubuntu-22.04
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate version info
        id: version
        run: |
          VERSION="v$(date +%Y%m%d.%H%M)-$(echo $GITHUB_SHA | head -c 7)"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
      
      - name: Prepare release files
        run: |
          cd release-artifacts
          
          # Package SDK
          if [ -d "sdk-internal-wasm" ]; then
            cd sdk-internal-wasm
            tar -czf ../bitwarden-sdk-wasm-${{ steps.version.outputs.tag }}.tar.gz *
            cd ..
          fi
          
          # Package Web
          if [ -d "bitwarden-web" ]; then
            cd bitwarden-web
            tar -czf ../bitwarden-web-${{ steps.version.outputs.tag }}.tar.gz *
            cd ..
          fi
          
          # Package Desktop (Linux)
          if [ -d "bitwarden-desktop-linux" ]; then
            cd bitwarden-desktop-linux
            tar -czf ../bitwarden-desktop-linux-${{ steps.version.outputs.tag }}.tar.gz *
            cd ..
          fi
          
          # Package Desktop (Windows)
          if [ -d "bitwarden-desktop-windows" ]; then
            cd bitwarden-desktop-windows
            zip -r ../bitwarden-desktop-windows-${{ steps.version.outputs.tag }}.zip *
            cd ..
          fi
          
          # Package Desktop (macOS)
          if [ -d "bitwarden-desktop-macos" ]; then
            cd bitwarden-desktop-macos
            tar -czf ../bitwarden-desktop-macos-${{ steps.version.outputs.tag }}.tar.gz *
            cd ..
          fi
          
          # Package CLI
          if [ -d "bitwarden-cli" ]; then
            cd bitwarden-cli
            tar -czf ../bitwarden-cli-${{ steps.version.outputs.tag }}.tar.gz *
            cd ..
          fi
          
          # Package Browser Extensions
          for browser in chrome firefox edge; do
            if [ -d "bitwarden-browser-$browser" ]; then
              cd "bitwarden-browser-$browser"
              zip -r ../bitwarden-browser-$browser-${{ steps.version.outputs.tag }}.zip *
              cd ..
            fi
          done
          
          # Generate checksums
          sha256sum *.tar.gz *.zip 2>/dev/null > checksums-${{ steps.version.outputs.tag }}.txt || true
          
          # List all files for release
          ls -la *.tar.gz *.zip *.txt 2>/dev/null || true
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Bitwarden Clients ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 🚀 Bitwarden Clients Release ${{ steps.version.outputs.tag }}
            
            **Build Date:** ${{ steps.version.outputs.date }}
            **Commit:** `${{ github.sha }}`
            **Branch:** `build-private`
            
            ### ✨ Features
            - ✅ **100% Open Source Build** - SDK built from source
            - ✅ **No Private Dependencies** - All dependencies are public
            - ✅ **Fully Auditable** - Complete build transparency
            - ✅ **SDK Source:** [dbds-team/my_sdk-internal](https://github.com/dbds-team/my_sdk-internal)
            
            ### 📦 Available Downloads
            
            #### Core Components
            - 🔧 **SDK WASM**: `bitwarden-sdk-wasm-*.tar.gz` - WebAssembly SDK built from source
            - 🌐 **Web Vault**: `bitwarden-web-*.tar.gz` - Self-hosted web interface
            - 💻 **CLI Tool**: `bitwarden-cli-*.tar.gz` - Command-line interface
            
            #### Desktop Applications
            - 🐧 **Linux**: `bitwarden-desktop-linux-*.tar.gz` - AppImage/deb/rpm packages
            - 🪟 **Windows**: `bitwarden-desktop-windows-*.zip` - exe/msi installers
            - 🍎 **macOS**: `bitwarden-desktop-macos-*.tar.gz` - dmg/pkg installers
            
            #### Browser Extensions
            - 🌍 **Chrome**: `bitwarden-browser-chrome-*.zip`
            - 🦊 **Firefox**: `bitwarden-browser-firefox-*.zip`
            - 🔷 **Edge**: `bitwarden-browser-edge-*.zip`
            
            ### 🔒 Security
            - All artifacts include SHA256 checksums in `checksums-*.txt`
            - Built entirely from public source code
            - No telemetry or tracking code
            
            ### 📝 Installation
            
            **Web Vault:**
            ```bash
            tar -xzf bitwarden-web-*.tar.gz
            # Serve with any web server
            ```
            
            **CLI:**
            ```bash
            tar -xzf bitwarden-cli-*.tar.gz
            chmod +x bw
            ./bw --help
            ```
            
            **Browser Extension:**
            1. Extract the zip file
            2. Open browser extension management
            3. Enable developer mode
            4. Load unpacked extension from extracted folder
            
            ### ⚠️ Note
            Some builds may have partial failures due to complex dependencies.
            Check individual artifact availability above.
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/*.txt